name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  official-gates:
    name: 官方门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 这两个脚本是从 jxxghp/MoviePilot-Plugins 原样 vendor 进来的，
      # 判定逻辑与官方 CI 完全一致，避免本地重写版与官方规则漂移。
      - name: 插件版本门禁（官方 check_plugin_versions.py）
        run: python .github/scripts/check_plugin_versions.py package.v3.json

      - name: 联邦 CSS 隔离门禁（官方 check_federation_css.py）
        run: python .github/scripts/check_federation_css.py --root .

      - name: 提交无空白错误
        run: git diff --check

  preflight:
    name: 本地发布前检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python 编译 / 元数据 / 隐私扫描 / 单元测试
        run: python .github/scripts/preflight.py